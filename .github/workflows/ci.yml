name: ci

on:
  push:
    branches: [main, gpui-rewrite]
  pull_request:

jobs:
  # The whole workspace, window included, on each platform it is built for.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-22.04
          # Compiled and checked here but never run by a person yet, so a failure
          # is reported without blocking the others until it has been seen green.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the window system and font development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-dev \
            libx11-xcb-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libvulkan-dev libdbus-1-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
