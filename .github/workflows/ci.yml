name: ci

on:
  push:
    branches: [main, gpui-rewrite]
  pull_request:

jobs:
  # The native UI is built and tested on macOS, the platform it is developed
  # and checked on.
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Everything except the window: the cluster logic has no window-system
  # dependency, so it is also checked where the UI is not built.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude kubernaut-ui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude kubernaut-ui
