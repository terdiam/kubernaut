name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Pinned deliberately. Bumping a version means bumping it here, which makes the
# change reviewable rather than silently picking up whatever is newest.
env:
  HELM_VERSION: v3.19.0
  TRIVY_VERSION: 0.74.0
  KUSTOMIZE_VERSION: v5.8.1

jobs:
  # Creates the draft once, so the platform jobs below do not race to create it.
  draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Draft on purpose: a person checks the artefacts before anyone downloads them.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --draft --title "Kubernaut ${GITHUB_REF_NAME}" --generate-notes

  macos:
    needs: draft
    # GITHUB_TOKEN is read-only by default in this repository, so uploading to
    # the release needs this granted.
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }

      - name: Fetch and verify helm, trivy and kustomize
        run: scripts/fetch-sidecars.sh darwin-arm64 sidecars

      - name: Build Kubernaut.app
        run: scripts/bundle-macos.sh --sidecars sidecars

      # The in-app updater installs a release only if it carries a signature that
      # verifies against the public key compiled into the app, so an unsigned
      # release is still a release but cannot be installed from inside the app.
      # Key setup: scripts in README, "Releasing signed updates".
      - name: Sign the zip
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; the release will not be installable by the in-app updater"
          else
            cargo run -q -p k8s-app --example update_tool -- sign dist/Kubernaut-*-macos-*.zip
          fi

      # Draft on purpose: a person checks the artefact before anyone downloads it.
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/Kubernaut-*-macos-*.zip* dist/Kubernaut-*-macos-*.dmg --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: Kubernaut-macos
          path: |
            dist/Kubernaut-*-macos-*.zip*
            dist/Kubernaut-*-macos-*.dmg

  linux:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sidecars: linux-amd64
          - os: ubuntu-24.04-arm
            sidecars: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the window system and font development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-dev \
            libx11-xcb-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libvulkan-dev libdbus-1-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }

      - name: Fetch and verify helm, trivy and kustomize
        run: scripts/fetch-sidecars.sh ${{ matrix.sidecars }} sidecars

      - name: Build the tarball and the .deb
        run: scripts/bundle-linux.sh --sidecars sidecars

      # The in-app updater downloads the tarball and installs it only if this
      # signature verifies. The .deb is not signed: apt installs it, and the app
      # does not replace a package that root owns.
      - name: Sign the tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; the release will not be installable by the in-app updater"
          else
            cargo run --release -q -p k8s-app --example update_tool -- sign dist/Kubernaut-*-linux-*.tar.gz
          fi

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/Kubernaut-*-linux-*.tar.gz* dist/kubernaut_*.deb --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: Kubernaut-${{ matrix.sidecars }}
          path: |
            dist/Kubernaut-*-linux-*.tar.gz*
            dist/kubernaut_*.deb

  # Built on a Windows runner and never run by a person yet; see the README.
  # The swap that updates it is run on a Windows runner by the tests in CI.
  windows:
    needs: draft
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }

      - name: Fetch and verify helm, trivy and kustomize
        shell: bash
        run: scripts/fetch-sidecars.sh windows-amd64 sidecars

      # Inno Setup builds the setup program. It is not on every runner image.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the zip and the setup program
        shell: pwsh
        run: scripts/bundle-windows.ps1 -Sidecars sidecars -Installer

      # The in-app updater downloads the zip and installs it only if this
      # signature verifies. The setup program is not signed: a person runs it.
      - name: Sign the zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set; the release will not be installable by the in-app updater"
          else
            cargo run --release -q -p k8s-app --example update_tool -- sign dist/Kubernaut-*-windows-*.zip
          fi

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/Kubernaut-*-windows-*.zip* dist/Kubernaut-*-windows-*-setup.exe --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: Kubernaut-windows
          path: |
            dist/Kubernaut-*-windows-*.zip*
            dist/Kubernaut-*-windows-*-setup.exe
