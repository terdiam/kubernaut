# Exercises the generic CRD path: the sidebar must list Widget automatically,
# and the table must pick up the additionalPrinterColumns below.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.demo.kubernaut.dev
spec:
  group: demo.kubernaut.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    shortNames: [wdg]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
                colour:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
      additionalPrinterColumns:
        - name: Size
          type: integer
          jsonPath: .spec.size
        - name: Colour
          type: string
          jsonPath: .spec.colour
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
---
apiVersion: demo.kubernaut.dev/v1
kind: Widget
metadata:
  name: blue-widget
  namespace: default
spec:
  size: 3
  colour: blue
