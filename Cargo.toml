[workspace]
resolver = "3"
members = [
    "crates/k8s-app",
    "crates/k8s-core",
    "crates/k8s-ops",
    "crates/k8s-metrics",
    "crates/k8s-helm",
    "crates/k8s-security",
    "crates/kubernaut-ui",
]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/masao/kubernaut"

[workspace.dependencies]
kube = { version = "4.2", default-features = false, features = [
    "client",
    "runtime",
    "derive",
    "ws",
    "gzip",
    "rustls-tls",
    # Explicit crypto provider: with default-features off, hyper-rustls would
    # otherwise have no provider and the oidc/oauth paths fail to compile.
    # `ring` over `aws-lc-rs` because it needs no cmake/nasm on Windows CI.
    "ring",
    "oidc",
    "oauth",
    "socks5",
    "http-proxy",
    "kubelet-debug",
] }
k8s-openapi = { version = "0.28", features = ["latest"] }
http = "1"
# Already compiled for rustls; here it verifies the signature on an update.
ring = "0.17"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

dashmap = "6"
arc-swap = "1"
parking_lot = "0.12"
directories = "6"
regex = "1"
base64 = "0.22"
# Parses a TLS Secret's certificate for display (domains, expiry) — no
# verification, so the verify/ring/aws-lc-rs features are switched off.
x509-parser = { version = "0.18", default-features = false }
similar = "2"
# Archive format for bulk export: openable by double-click on both macOS and
# Windows, unlike a tarball.
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
# Trivy scan-result cache. `bundled` compiles SQLite in rather than requiring
# a system library, so the release build gains no new external dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
portable-pty = "0.9"
rand = "0.10"

# One dependency for the native UI: it pins the matching gpui fork family and
# re-exports gpui, gpui-base and gpui-component. Depending on `gpui` directly
# alongside it would pull a second, incompatible copy of gpui's types.
# `tree-sitter-yaml` gives the read-only object view its syntax highlighting.
gpui-kit = { version = "0.9.1", features = ["tree-sitter-yaml"] }

# Terminal emulation (escape sequences, grid, scrollback) for the native terminal.
alacritty_terminal = "0.26"


k8s-app = { path = "crates/k8s-app" }
k8s-core = { path = "crates/k8s-core" }
k8s-ops = { path = "crates/k8s-ops" }
k8s-metrics = { path = "crates/k8s-metrics" }
k8s-helm = { path = "crates/k8s-helm" }
k8s-security = { path = "crates/k8s-security" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Debug info is the bulk of the size and goes; the symbol table stays, because
# the panic hook writes `Backtrace::force_capture()` into the crash log and
# `strip = true` reduces every one of those to bare addresses.
strip = "debuginfo"
panic = "abort"

# Smallest binary: `cargo build --profile release-small -p <crate>`.
# Not for shipping builds: stripping every symbol turns the crash log's
# backtraces into bare addresses (see `strip` above), and `opt-level = "z"`
# trades some speed for size.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
# Full debuginfo of a GPUI application is several gigabytes per build and was
# filling the disk: every rebuild, test and clippy run kept its own copy. File
# and line tables are all a backtrace or a log needs.
debug = "line-tables-only"

# Dependencies are never stepped into here, so they carry no debuginfo at all.
[profile.dev.package."*"]
debug = false
